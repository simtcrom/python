name: Build release binaries

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

# on:
#   workflow_dispatch:
#   push:
#     branches:
#       - main
      
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cat-vs-rat-game-linux
            asset_name: cat-vs-rat-game-linux
          # - os: windows-latest
          #   artifact_name: cat-vs-rat-game-windows
          #   asset_name: cat-vs-rat-game-windows.exe
          - os: macos-latest
            artifact_name: cat-vs-rat-game-macos
            asset_name: cat-vs-rat-game-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Create virtual environment and install project deps
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv venv
          uv sync --group dev

      - name: Run tests
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv run pytest -q

      - name: Show pygame version
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv run python -c "import pygame; print(pygame.version.ver)"          

      - name: Show packages
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv pip freeze

      - name: Show versions
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv run python --version
          uv run pyinstaller --version

      - name: Build binary
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv run pyinstaller --clean --windowed --onedir --strip --name cat-vs-rat-game src/game.py

      - name: Sign macOS binary
        shell: bash
        working-directory: cat-vs-rat-game
        if: runner.os == 'macOS'
        run: |
          codesign -s - -f --deep dist/cat-vs-rat-game.app

      - name: Show build sizes
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          echo "=== dist ==="
          ls -lh dist
          echo
          du -sh dist/*
          
      - name: Prepare artifact
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          mkdir -p release-artifacts
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/cat-vs-rat-game.exe release-artifacts/${{ matrix.asset_name }}.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cd dist && zip -r ../release-artifacts/${{ matrix.asset_name }}.zip cat-vs-rat-game.app
          else
            cd dist && zip -r ../release-artifacts/${{ matrix.asset_name }}.zip cat-vs-rat-game
          fi

      - name: Show zip size
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          ls -lh release-artifacts        

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: cat-vs-rat-game/release-artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || 'v0.1.0' }}
          files: |
            release-artifacts/cat-vs-rat-game-linux/cat-vs-rat-game-linux
            release-artifacts/cat-vs-rat-game-macos/cat-vs-rat-game-macos.zip