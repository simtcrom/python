name: Build release binaries

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cat-vs-rat-game-linux
            asset_name: cat-vs-rat-game-linux-amd64

          - os: windows-latest
            artifact_name: cat-vs-rat-game-windows
            asset_name: cat-vs-rat-game-windows-amd64

          - os:
              - self-hosted
              - macOS
              - ARM64
            artifact_name: cat-vs-rat-game-macos
            asset_name: cat-vs-rat-game-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          VERSION=$(python3 - <<'EOF'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              print("v" + tomllib.load(f)["project"]["version"])
          EOF
          )

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up Python
        if: runner.environment != 'self-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        
      - name: Set up Python (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install build dependencies
        if: runner.environment != 'self-hosted'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Create virtual environment and install project deps
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv venv
          uv sync --group dev

      - name: Run tests
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv run pytest -q

      - name: Show pygame version
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv run python -c "import pygame; print(pygame.version.ver)"

      - name: Show packages
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv pip freeze

      - name: Show versions
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv run python --version
          uv run pyinstaller --version

      - name: Build binary
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then

            uv run pyinstaller \
              --clean \
              --windowed \
              --onefile \
              --name cat-vs-rat-game \
              src/game.py

          else

            uv run pyinstaller \
              --clean \
              --windowed \
              --onedir \
              --strip \
              --name cat-vs-rat-game \
              src/game.py

          fi

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          codesign -s - -f --deep dist/cat-vs-rat-game.app

      - name: Show build sizes
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          echo "=== dist ==="
          ls -lh dist
          echo
          du -sh dist/*

      - name: Prepare artifact
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          mkdir -p release-artifacts

          if [ "$RUNNER_OS" = "Windows" ]; then

            cp dist/cat-vs-rat-game.exe \
              release-artifacts/${{ matrix.asset_name }}-${VERSION}.exe

          elif [ "$RUNNER_OS" = "macOS" ]; then

            ditto -c -k \
              --sequesterRsrc \
              --keepParent \
              dist/cat-vs-rat-game.app \
              release-artifacts/${{ matrix.asset_name }}-${VERSION}.zip

          else

            cd dist

            zip -r \
              ../release-artifacts/${{ matrix.asset_name }}-${VERSION}.zip \
              cat-vs-rat-game

          fi

      - name: Show zip size
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          ls -lh release-artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: cat-vs-rat-game/release-artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Show downloaded artifacts
        run: |
          pwd
          find release-artifacts -type f

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || needs.build.outputs.version }}
          files: |
            release-artifacts/cat-vs-rat-game-linux/*
            release-artifacts/cat-vs-rat-game-macos/*
            release-artifacts/cat-vs-rat-game-windows/*