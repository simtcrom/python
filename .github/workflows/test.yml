name: Test GitHub Actions

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cat-vs-rat-game-linux
            asset_name: cat-vs-rat-game-linux
          # - os: windows-latest
          #   artifact_name: cat-vs-rat-game-windows
          #   asset_name: cat-vs-rat-game-windows.exe
          - os: macos-latest
            artifact_name: cat-vs-rat-game-macos
            asset_name: cat-vs-rat-game-macos    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install uv          

      - name: Create virtual environment and install project deps
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv venv
          uv sync --group dev

      - name: Run tests
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv run pytest -q

      - name: Build binary
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          uv run pyinstaller --clean --windowed --onefile --name cat-vs-rat-game src/game.py

      - name: Prepare artifact
        shell: bash
        working-directory: cat-vs-rat-game
        run: |
          mkdir -p release-artifacts
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/cat-vs-rat-game.exe release-artifacts/${{ matrix.asset_name }}
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp dist/cat-vs-rat-game release-artifacts/${{ matrix.asset_name }}
          else
            cp dist/cat-vs-rat-game release-artifacts/${{ matrix.asset_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/

      - name: Print Hello
        run: |
          echo "1st Hello from GitHub Actions!"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Current date:"
          date

      - name: List files
        run: ls -la

      - name: Success
        run: echo "✅ Workflow completed successfully!"
