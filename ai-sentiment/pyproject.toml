[project]
name = "ai-sentiment"
version = "0.1.0"
description = "Simple FastAPI AI Sentiment Analyzer"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.95",
    "uvicorn[standard]>=0.20",
    "transformers>=4.34",
    "torch>=2.0",
    "pytest>=7.0",
    "httpx2>=2.7.0"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.dev-dependencies]
pytest = "^7.0"
